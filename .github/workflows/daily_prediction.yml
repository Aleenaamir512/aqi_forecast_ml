name: Daily AQI Prediction

on:
  workflow_dispatch:   # manual run
  schedule:
    - cron: "0 2 * * *"   # runs daily at 2 AM UTC

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AQI prediction
        run: |
          python prediction_model.py

      - name: Upload AQI forecast CSV
        uses: actions/upload-artifact@v4
        with:
          name: aqi-forecast-csv
          path: aqi_3day_forecast.csv

      - name: Upload AQI forecast plot
        uses: actions/upload-artifact@v4
        with:
          name: aqi-forecast-plot
          path: aqi_3day_forecast.png
