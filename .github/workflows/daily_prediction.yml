name: Daily AQI Forecast

# Trigger workflow every day at 8 AM UTC
on:
  schedule:
    - cron: '04 4 * * *'  # This is 9 AM PKT in UTC
  workflow_dispatch:       # still keep manual trigger if you want

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install joblib pandas matplotlib

      # 4. Run the prediction script
      - name: Run AQI prediction
        run: |
          python prediction_model.py

      # 5. Commit updated CSV and forecast plots
      - name: Commit & Push updated forecast
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add aqi_3day_forecast.csv
          git commit -m "Daily AQI forecast update"
          git push
        env:
          # GitHub token for pushing changes
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
