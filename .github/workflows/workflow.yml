name: Daily AQI Forecast

on:
  workflow_dispatch: # allows manual run
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6:00 UTC

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AQI prediction
        run: python prediction_model.py

      - name: Upload forecast as artifact
        uses: actions/upload-artifact@v3
        with:
          name: aqi-forecast
          path: |
            aqi_3day_forecast.csv
            aqi_3day_forecast.png
